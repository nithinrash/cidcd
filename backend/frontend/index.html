<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winger IT - AI Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid main-container">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <img src="logo-removebg-preview.png" alt="Winger IT Logo" class="logo">
                <h1 class="gradient-text">Winger IT Solutions</h1>
                <h3 class="text-muted">AI Support Desk</h3>
            </div>
        </div>

        <!-- Feature Badges -->
        <div class="row feature-badges justify-content-center mb-4">
            <div class="col-auto">
                <span class="badge bg-primary">📧 Email Notification</span>
                <span class="badge bg-success">🧠 Smart Session Memory</span>
                <span class="badge bg-warning">📄 Document-Aware</span>
                <span class="badge bg-danger">👩‍💼 Human Escalation</span>
            </div>
        </div>

        <!-- Ticket Input Section -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">🎫 Ticket Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input
                                type="text"
                                id="ticketInput"
                                class="form-control"
                                placeholder="Enter ticket number (optional)"
                            >
                            <button
                                class="btn btn-primary"
                                onclick="startChat()"
                            >
                                Start Chat
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <div class="row justify-content-center" id="chatSection" style="display:none;">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">💬 Chat Support</h5>
                        <small id="ticketIdDisplay" class="text-muted"></small>
                    </div>
                    <div class="card-body chat-messages" id="chatMessages">
                        <!-- Chat messages will be dynamically added here -->
                    </div>
                    <div class="card-footer">
                        <div class="input-group">
                            <input
                                type="text"
                                id="messageInput"
                                class="form-control"
                                placeholder="Type your message here..."
                            >
                            <button
                                class="btn btn-success"
                                onclick="sendMessage()"
                            >
                                Send
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Retrieved Documents Modal -->
        <div class="modal fade" id="documentsModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">📄 Retrieved Documents</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="documentsModalBody">
                        <!-- Documents will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
