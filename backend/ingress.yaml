apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"  # For Google Cloud
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: fastapi-backend-service
            port:
              number: 80  # Match the port shown in your kubectl get services output
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80